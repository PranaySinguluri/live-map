<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LiveMap">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%237F77DD'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white'>📍</text></svg>">
    <title>LiveMap</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow: hidden; }
        
        #loginScreen {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, #7F77DD 0%, #534AB7 100%);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        
        #loginScreen.hidden { display: none; }
        
        .login-card {
            background: white; border-radius: 16px; padding: 32px;
            width: 100%; max-width: 340px; box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .login-card h1 { font-size: 24px; margin-bottom: 8px; color: #000; }
        .login-card p { font-size: 13px; color: #888; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; font-weight: 500; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 16px; font-family: inherit;
        }
        .form-group input:focus { outline: none; border-color: #7F77DD; }
        
        .btn {
            width: 100%; padding: 12px; background: #7F77DD; color: white;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 500;
            cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: #534AB7; }
        .btn:active { transform: scale(0.98); }
        
        .error { color: #E24B4A; font-size: 12px; margin-top: 8px; }
        .small-text { font-size: 11px; color: #888; margin-top: 4px; display: block; }
        
        #map { height: 100vh; width: 100vw; }
        
        .app-header {
            position: fixed; top: env(safe-area-inset-top, 20px); left: 12px; right: 12px;
            display: flex; gap: 8px; z-index: 1000;
        }
        
        .user-badge {
            flex: 1; padding: 12px; background: white; border-radius: 10px;
            font-size: 13px; font-weight: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .logout-btn {
            padding: 10px 16px; background: #E24B4A; color: white; border: none;
            border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer;
        }
        
        .status-bar {
            position: fixed; bottom: env(safe-area-inset-bottom, 20px); left: 12px; right: 12px;
            background: white; padding: 14px; border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15); z-index: 1000;
        }
        
        .status-row { display: flex; justify-content: space-between; align-items: center; }
        .user-name { font-weight: 500; font-size: 14px; }
        .user-time { font-size: 12px; color: #888; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .dot-partner { background: #D4537E; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-card">
            <h1>LiveMap</h1>
            <p>Share your location safely</p>
            
            <div class="form-group">
                <label for="userName">Your name</label>
                <input type="text" id="userName" placeholder="e.g., Pranay">
            </div>
            
            <div class="form-group">
                <label for="userCode">Your access code</label>
                <input type="text" id="userCode" placeholder="4-digit code" maxlength="4">
                <span class="small-text">Share this code so others can see your location</span>
            </div>
            
            <div class="form-group">
                <label for="partnerCodeLogin">Partner's access code</label>
                <input type="text" id="partnerCodeLogin" placeholder="Their 4-digit code" maxlength="4">
                <span class="small-text">Enter your partner's code to see their location</span>
            </div>
            
            <button class="btn" id="loginBtn">Start Sharing</button>
            <div id="loginError" class="error"></div>
        </div>
    </div>
    
    <div id="appContainer" style="display: none; height: 100vh;">
        <div class="app-header">
            <div class="user-badge">
                <span id="currentUser">Loading...</span>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
        
        <div id="map"></div>
        
        <div class="status-bar">
            <div class="status-row">
                <span><span class="dot dot-partner"></span><span class="user-name" id="partnerName">Connecting...</span></span>
                <span class="user-time" id="partnerTime">--</span>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = 'https://live-map-production-8706.up.railway.app';
        
        let currentUser = null;
        let currentUserCode = null;
        let partnerCode = null;
        let map = null;
        let partnerMarker = null;
        let refreshInterval = null;

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(() => {
                fetchPartnerLocation();
                sendMyLocation();
            }, 10000);
        }

        function restoreLogin() {
            const savedUser = localStorage.getItem('liveMapUser');
            const savedCode = localStorage.getItem('liveMapCode');
            const savedPartnerCode = localStorage.getItem('liveMapPartnerCode');
            
            if (savedUser && savedCode && savedPartnerCode) {
                currentUser = savedUser;
                currentUserCode = savedCode;
                partnerCode = savedPartnerCode;
                showApp();
                document.getElementById('currentUser').textContent = currentUser;
                sendMyLocation();
                startAutoRefresh();
                fetchPartnerLocation();
            }
        }

        // Login
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const userName = document.getElementById('userName').value.trim();
            const userCode = document.getElementById('userCode').value.trim();
            const partnerCodeInput = document.getElementById('partnerCodeLogin').value.trim();
            
            if (!userName || !userCode || !partnerCodeInput) {
                document.getElementById('loginError').textContent = 'Please fill in all fields';
                return;
            }
            
            if (userCode.length !== 4 || partnerCodeInput.length !== 4) {
                document.getElementById('loginError').textContent = 'Access codes must be 4 digits';
                return;
            }
            
            currentUser = userName;
            currentUserCode = userCode;
            partnerCode = partnerCodeInput;
            
            // Save to localStorage
            localStorage.setItem('liveMapUser', userName);
            localStorage.setItem('liveMapCode', userCode);
            localStorage.setItem('liveMapPartnerCode', partnerCodeInput);
            
            showApp();
            document.getElementById('currentUser').textContent = userName;
            sendMyLocation();
            startAutoRefresh();
            fetchPartnerLocation();
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            currentUser = null;
            currentUserCode = null;
            partnerCode = null;
            if (refreshInterval) clearInterval(refreshInterval);
            localStorage.removeItem('liveMapUser');
            localStorage.removeItem('liveMapCode');
            localStorage.removeItem('liveMapPartnerCode');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('userName').value = '';
            document.getElementById('userCode').value = '';
            document.getElementById('partnerCodeLogin').value = '';
            document.getElementById('loginError').textContent = '';
            if (map) map.remove();
        });

        function showApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').style.display = 'block';
            initMap();
        }

        function initMap() {
            if (map) map.remove();
            map = L.map('map').setView([44.6488, -63.5752], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
        }

        async function sendMyLocation() {
            if (!navigator.geolocation || !currentUser || !currentUserCode) return;
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    await fetch(API_BASE + '/api/locations/' + currentUserCode, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            userId: currentUser,
                            latitude: pos.coords.latitude,
                            longitude: pos.coords.longitude
                        })
                    });
                } catch (e) { console.error('Location send error:', e); }
            }, null, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
        }

        async function fetchPartnerLocation() {
            if (!currentUser || !currentUserCode || !partnerCode) return;
            
            try {
                const res = await fetch(API_BASE + '/api/partner/' + currentUserCode + '/' + partnerCode);
                const data = await res.json();
                
                if (data.success) {
                    const latlng = [data.latitude, data.longitude];
                    
                    document.getElementById('partnerName').textContent = data.userId || 'Partner';
                    const diff = (Date.now() - new Date(data.updatedAt).getTime()) / 1000;
                    const timeAgo = diff < 60 ? Math.floor(diff) + 's ago' : Math.floor(diff / 60) + 'm ago';
                    document.getElementById('partnerTime').textContent = timeAgo;
                    
                    if (partnerMarker) {
                        partnerMarker.setLatLng(latlng);
                    } else {
                        partnerMarker = L.marker(latlng, {
                            icon: L.divIcon({
                                html: '<div style="background:#D4537E;width:24px;height:24px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>',
                                className: '', iconSize: [24, 24], iconAnchor: [12, 12]
                            })
                        }).addTo(map);
                    }
                    
                    map.setView(latlng, 15);
                } else {
                    document.getElementById('partnerName').textContent = 'Error: ' + (data.error || 'unknown');
                }
            } catch (e) {
                document.getElementById('partnerName').textContent = 'Connection error';
                console.error('Fetch partner error:', e);
            }
        }

        // On page load, restore login if it exists
        window.addEventListener('load', restoreLogin);
    </script>
</body>
</html>
